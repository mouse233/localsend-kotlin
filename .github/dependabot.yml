version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: [ "*" ]

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    # AndroidX Core 1.18+ requires minSdk 23; keep Android 5.0 (API 21) support.
    ignore:
      - dependency-name: "androidx.core:core-ktx"
        versions: [ "[1.18.0,)" ]
    groups:
      gradle-non-major:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
